version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /worker
      - /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # web's RPC client is typed against the worker's routes: both must move together.
      hono:
        patterns: [hono]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
