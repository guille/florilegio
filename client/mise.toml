[env._]
path = [
  "{{config_root}}/node_modules/.bin",
]

[deps.flutter]
auto = true

[tasks.test]
run = "flutter test"

[tasks.fmt]
run = "dart format ."

[tasks.check]
run = "flutter analyze"

[tasks.reload]
run = "[ -f .flutter.pid ] && kill -USR1 \"$( < .flutter.pid )\" || echo \"not running\""

[tasks.restart]
run = "[ -f .flutter.pid ] && kill -USR2 \"$( < .flutter.pid )\" || echo \"not running\""

[tasks."run:android"]
run         = "flutter run --pid-file=.flutter.pid"
description = "Runs the frontend (Android)"

[tasks."run:web"]
run         = "flutter run -d web-server --no-web-resources-cdn --wasm --web-port 38951"
description = "Runs the frontend (web)"

[tasks."build:web"]
sources = ["pubspec.*", "assets/**/*", "lib/**/*.dart", "web/**/*"]
outputs = ["build/web-dist/**/*"]
run     = "flutter build web --release --no-web-resources-cdn -o build/web-dist"

[tasks."open:web"]
run = "timeout 60 sh -c 'until curl -fsS --max-time 5 -o /dev/null http://localhost:38951; do sleep 1; done' && xdg-open http://localhost:38951"

[tasks."deploy:web"]
depends     = "build:web"
description = "Deploys the frontend to Cloudflare Pages"
run         = "wrangler pages deploy"

[tasks."build:android:debug"]
description = "Builds a debug APK"
run         = "flutter build apk --debug"

[tasks."build:android:release"]
depends     = "decrypt-signing"
description = "Builds a release APK, signed with the personal keystore"
run         = "flutter build apk --release"

[tasks.decrypt-signing]
description = "Decrypt the signing keystore and its credentials"
env         = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/age/key.txt" }
sources     = ["android/signing/personal.keystore.age", "android/signing/creds.env.json"]
outputs     = ["android/signing/personal.keystore", "android/signing/key.properties"]
run         = [
  "age -d -i $SOPS_AGE_KEY_FILE -o android/signing/personal.keystore android/signing/personal.keystore.age",
  "sops -d --output-type dotenv --output android/signing/key.properties android/signing/creds.env.json",
]
